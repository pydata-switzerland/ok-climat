[workspace]
name = "pixi_env"
channels = ["conda-forge"]
platforms = ["osx-64", "win-64", "linux-64"]  # Support for macOS, Windows, and Linux

[dependencies]
python = "==3.10.12"
numpy = "==1.26.4"
pandas = "*"
scipy = "*"
requests = "*"
beautifulsoup4 = "*"
lxml = ">=4.0.0,<6.0.0"  # <-- Pin to compatible version
selenium = "*"

[pypi-dependencies]
pdfplumber = "*"
docling = "==2.26.0"
torch = "==2.2.2"
torchvision = "==0.17.2"
transformers = "<5.9"
accelerate = "*"